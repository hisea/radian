# ADR 0035 与 2026-10-16 输入框补充：`tui.input_style` 是输入框的形状。
# 默认 `lines`（上下两条横线加 `❯ ` 提示）；`box` 是与代码块开口线框同形的半包框（上边框
# `╭────`、正文行 `│ ❯ 文本`、下边 `╰──`）。`bar` 已被移除：写了它是启动警告并回退 `lines`；
# 其他未知值同样警告并回退（展示偏好，不拒绝文件）。
schema_version = 1

[model]
provider = "example"
base_url = "https://example.com/v1"
model = "m-1"

[tui]
input_style = "box"
