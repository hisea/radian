schema_version = 1

[hub]
# The HTTP API's port; it binds loopback only.
port = 7341
# Tasks in `doing` across every registered repository.
concurrency = 4
# Seconds between two scheduling passes.
interval_secs = 30
# Seconds a hub-held session may sit idle before its process exits.
session_idle_secs = 3600

[hub.hooks]
# Commands run once when a live session's pending queue gets a new head.
after_pending = ["true"]
