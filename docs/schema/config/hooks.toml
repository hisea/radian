# ADR 0045 切片 A：用户级外部命令 hook（Claude/Codex 子集）。
# 四个事件（`PreToolUse`/`PermissionRequest`/`PostToolUse`/`Stop`），每个是
# `{ matcher, hooks }` 条目列表，每个 hook 是 `{ type = "command", command, args, timeout, async, asyncRewake }`；
# `args` 是可选的字符串数组（有它是 exec 形式，不经 shell；ADR 0045 §4）。
# `async`/`asyncRewake` 只在 `PostToolUse` 与 `Stop` 上有效（ADR 0045 §5）。
# `matcher` 只认 Radian 工具名（`shell`/`write`/`patch`/`read`……），`|` 分隔多个。
# 子集之外（`type = "http"`、`PreToolUse` 上的 `async`、未知事件名）只跳过、不拒绝。
schema_version = 1

# 内建验证器的开关（backlog `turn-end-continuation.md` §B.6）：缺省开；`false` 关掉内建规则（用户 `Stop` hook 照跑）。
[hooks]
intent_stop = false

[[hooks.PreToolUse]]
matcher = "shell|write"
[[hooks.PreToolUse.hooks]]
type = "command"
command = "/work/example/hooks/check-shell.sh"
timeout = 10

# 判出 ask 之后、问人之前：脚本用 `decision.behavior` 回答（ADR 0045 §4）。
[[hooks.PermissionRequest]]
matcher = "shell"
[[hooks.PermissionRequest.hooks]]
type = "command"
command = "/work/example/hooks/answer-ask.sh"

[[hooks.PostToolUse]]
matcher = "patch"
[[hooks.PostToolUse.hooks]]
type = "command"
command = "/work/example/hooks/lint.sh"
[[hooks.PostToolUse.hooks]]
type = "command"
command = "/work/example/hooks/format"
args = ["--check", "src/lib.rs"]

# 后台跑（ADR 0045 §5）：结果在下次模型调用前送达；`asyncRewake` 退出 2 唤醒空闲会话。
[[hooks.PostToolUse]]
matcher = "write"
[[hooks.PostToolUse.hooks]]
type = "command"
command = "/work/example/hooks/lint-async.sh"
async = true
[[hooks.PostToolUse.hooks]]
type = "command"
command = "/work/example/hooks/rewake.sh"
asyncRewake = true

[[hooks.Stop]]
[[hooks.Stop.hooks]]
type = "command"
command = "/work/example/hooks/verify.sh"
timeout = 30

# 只观察的两个事件（ADR 0045 §6）：后台跑、不读 stdout、超时/退出码只记一行最近运行。
# `StopFailure` 的 matcher 是 `ModelErrorKind` 闭集；`Notification` 只有 `permission_prompt` 与
# `idle_prompt`。`async` 在这两个事件上被接受但无意义（本来就在后台跑）。
[[hooks.StopFailure]]
matcher = "usage_limit"
[[hooks.StopFailure.hooks]]
type = "command"
command = "/work/example/hooks/quota.sh"

[[hooks.Notification]]
matcher = "permission_prompt"
[[hooks.Notification.hooks]]
type = "command"
command = "/work/example/hooks/notify.sh"

# 子集之外：逐条跳过并各报一行（启动行 `[config] ignored key …`）。
[[hooks.PreToolUse]]
matcher = "read"
[[hooks.PreToolUse.hooks]]
type = "http"
command = "https://example.com/hook"

# `PreToolUse` 不接受 `async`：那个 hook 逐条跳过、其余 hook 照载。
[[hooks.PreToolUse]]
matcher = "write"
[[hooks.PreToolUse.hooks]]
type = "command"
command = "/work/example/hooks/late-sync.sh"
[[hooks.PreToolUse.hooks]]
type = "command"
command = "/work/example/hooks/late-async.sh"
async = true

[[hooks.SessionStart]]
matcher = "read"
[[hooks.SessionStart.hooks]]
type = "command"
command = "/work/example/hooks/early.sh"
