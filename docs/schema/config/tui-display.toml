# ADR 0028 R2/R3/R4/R8:`[tui.display]` 是展示偏好。`reasoning` = collapsed(默认)|expanded|hidden;
# `tool_output` = collapsed|expanded|errors(默认);`tool_preview_lines` 是折叠时正文的预览行数(默认 5);
# `mermaid`（R8，默认 true）画已闭合的 mermaid 代码块;`highlight`（R2，默认 true）给已闭合、语言认识的
# 代码块做语法高亮。未知值/未知键是启动警告,不是拒绝(展示偏好从不拒绝文件)。
schema_version = 1

[model]
provider = "openai-compatible"
base_url = "https://example.com/v1"
model = "m-1"

[tui.display]
reasoning = "collapsed"
tool_output = "errors"
tool_preview_lines = 8
mermaid = true
highlight = false
