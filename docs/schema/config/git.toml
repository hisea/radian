# ADR 0030 R10 / 修订 4、ADR 0039 决定 3：`[git]` 是 `git_commit` 的规则。
# `protected_branches` 列出除 `main`/`master` 外同样拒绝提交的分支；`allowed_filters` 列出
# Radian 自己用固定命令运行的 `filter.<名字>` 驱动（默认 `["lfs"]`，空表 `[]` 表示一个都不
# 允许）。宿主用 `git check-attr filter` 读出每个待暂存路径的驱动，只用不跑 filter 的
# plumbing 暂存，从不运行仓库配置里的 filter 命令：只有 `lfs` 由 Radian 的 `git-lfs clean`
# 运行，其余驱动一律拒绝且什么都不暂存。
schema_version = 1

[git]
protected_branches = ["release"]
allowed_filters = ["lfs"]
