# `[shell]` has no live keys. `auto_background_secs` (the old auto-background
# threshold) was removed: background happens only with an explicit `background: true`,
# and the foreground timeout is the built-in default. An old config that still sets the
# key parses fine — the key warns once on the startup line (`skipped`) and is ignored,
# never an error.
schema_version = 1

[shell]
auto_background_secs = 120
