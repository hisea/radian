# ADR 0021: `[memory]` is the memory index-injection configuration. `enabled` turns the
# injection off; `scopes` selects the index files; `index_max_lines` and `index_max_bytes`
# cap each index. The retired `[memory.injection]` keys are ignored with one migration
# warning per key.
schema_version = 1

[model]
provider = "example"
base_url = "https://example.com/v1"
model = "m-1"

[memory]
enabled = true
scopes = ["project", "global"]
index_max_lines = 200
index_max_bytes = 25600
