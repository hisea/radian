# `[memory]` is a retired key (persistent memory was removed, ADR 0021). An old config that
# still carries it parses fine: the table and every key under it warn once on the startup
# line (`skipped`, as `memory`) and are ignored, never an error. The values below are what
# the last memory-era radian wrote.
schema_version = 1

[model]
provider = "example"
base_url = "https://example.com/v1"
model = "m-1"

[memory]
enabled = true
scopes = ["project", "global"]
index_max_lines = 200
index_max_bytes = 25600
sessions_index_max_lines = 1000
