# `tui.bell` 是终端提醒的开关。默认 `off`（不响）；`attention` 在审批提示/`ask_user`
# 问题打开、回合结束（正常或 `turn failed`）时各发一个 BEL（`\x07`）；`all` 另加后台 job
# 完成通知到达时。每个事件最多一个 BEL，流式输出中不发，同一帧多个事件合并成一个。
# 未知值是启动警告并回落 `off`（展示偏好，不拒绝文件；与 `tui.clipboard` 同规则）。
schema_version = 1

[model]
provider = "example"
base_url = "https://example.com/v1"
model = "m-1"

[tui]
bell = "attention"
