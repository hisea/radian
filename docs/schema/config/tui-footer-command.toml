# ADR 0027: an out-of-process footer item.
# `[tui.footer.items.<id>] command = "<executable or command line>"` runs a user command as the
# user (unsandboxed) and shows its first stdout line; `period` is its refresh period in seconds
# (15–3600; 0 = run once at startup). The reader keeps both as item parameters; v1 has one config
# layer, chosen by the user (`--config` > `RADIAN_CONFIG` > `~/.radian/config/config.toml`), so
# every command is accepted (no project-level config, ADR 0031; when one is added a command must
# be refused there, and that slice owns the test).
schema_version = 1

[tui.footer]
preset = "deck"
glyphs = "unicode"

[tui.footer.items.weather]
command = "printf 72F"
symbol = "w "
period = 300

[tui.footer.items.host_tag]
command = "hostname"
period = 0

[[tui.footer.rows]]
left = ["model", "weather", "host_tag"]
