# ADR 0027: an old config that sets the retired out-of-process footer item keys.
# `[tui.footer.items.<id>] command` and `period` were removed. A file that still sets them opens
# normally: the reader keeps both as item parameters, the TUI warns one line per item, then
# ignores them and treats the id as an unknown item. It never refuses the file (ADR 0008).
schema_version = 1

[tui.footer]
preset = "deck"
glyphs = "unicode"

[tui.footer.items.weather]
command = "printf 72F"
symbol = "w "
period = 300

[tui.footer.items.host_tag]
command = "hostname"
period = 0

[[tui.footer.rows]]
left = ["model", "weather", "host_tag"]
