# ADR 0030 切片 9（O7/O8）：`[orchestration]` 是 lead 的编排快照的**用户级**来源。
# 项目级同名文件 `<workspace>/.radian/orchestration.toml` 在**工作区受信任**时读（ADR 0031 T1），
# 逐键覆盖用户级。
# - `max_tasks`：一个 lead 进程同时在跑的 task 上限（缺省 4）；超出 FIFO 排队。
# - `isolation`/`model`/`profile`：`spawn_task` 的默认值（低于 spawn 参数与 agent 定义；
#   profile 只能收窄到 `safe`/`workspace`）。
# - `worktree_root`：人工/集成 worktree 的根（ADR 0039 决定 4 之后 task worktree 不在工作区内）；
#   本切片刻意不消费它。
# - `verify`：task 结束、收尾提交之后，在**该 task 自己的沙箱**（workspace 档位、根是它的 worktree、
#   关网、同一份禁读清单）里依次运行的命令；每条记退出码与有界输出尾部（ADR 0030 R2）。
# - `policy`：三层审批第 2 层的边缘策略命令（stdin 收待决请求 JSON，stdout 回 allow|deny|ask）；
#   只能来自用户配置或受信任的项目配置，绝不来模型的工具参数（ADR 0030 第 3 项）。
# - `heavy`/`heavy_slots`：重活模式与进程级并发槽（缺省 2）；verify 与匹配 heavy 的 shell 命令排队。
# - `stall_after_secs`：两个时间戳都超过它才算卡住（缺省 600）。
# - `merge_needs_human`：合并要不要人批准（缺省 true；只放开 task→`radian/integration`）。
schema_version = 1

[orchestration]
max_tasks = 4
isolation = "worktree"
model = "opencode-go/glm-5.7"
profile = "workspace"
worktree_root = "/work/example/.radian-worktrees"
verify = ["cargo fmt --all -- --check", "cargo test --workspace --locked"]
policy = "/work/example/.radian/policy.sh"
heavy = ["cargo build", "cargo test", "cargo clippy"]
heavy_slots = 2
stall_after_secs = 600
merge_needs_human = true
