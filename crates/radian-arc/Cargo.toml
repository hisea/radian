[package]
name = "radian-arc"
version = "0.2.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "arc, the plan and task orchestrator: storage, gate, worker wrapper, and the lead's MCP server"
publish = false

[dependencies]
# The stored credential check `init` runs, the stdout helpers every subcommand writes
# through (a closed pipe is a normal stop, not a failure), and the one host `git` command
# builder: every git call arc makes carries the shared no-filter/no-hook overrides.
radian-host = { version = "0.2.0", path = "../radian-host" }
radian-coding = { version = "0.2.0", path = "../radian-coding" }
# The `workspace` tier probe `init` runs: the same `Sandbox::new` a session uses, so a
# repository whose sandbox cannot start is reported.
radian-sandbox = { version = "0.2.0", path = "../radian-sandbox" }
# The parser `radian exec` runs: `worker_args::check` parses the worker's command line with
# it before `start`, a `run` pass or `confirm` acts. `radian-exec` does not depend on
# `radian-arc`, so this is not a cycle.
radian-exec = { version = "0.2.0", path = "../radian-exec" }
# The `Parser` trait alone: the check calls `radian_exec::Cli::try_parse_from` in-process
# instead of starting a child process.
clap = "4"
# Attempt and verdict timestamps use the same RFC 3339 UTC form as `radian-session` and
# `radian-memory`.
chrono = "0.4"
# `state.lock`, `runner.lock` and the gate's stage locks are flock(2) locks.
fs2 = "0.4"
# `kill(-pid, SIGKILL)` for a gate command that runs past its timeout.
libc = "0.2"
# The ledger's content hash and `verdict_set_digest` (ADR 0048 decision 11).
sha2 = "0.10"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# `config.toml` (ADR 0048 decision 15) has the same TOML shape as the radian configuration
# file (ADR 0008), and the docs drift test renders its defaults from the same parser.
toml = "0.8"
# `radian arc mcp` (ADR 0048 decision 11) is an MCP server. Pinned like `agent-extensions`:
# the lifecycle and wire behavior were verified against this exact version. `server` adds
# the handler traits and `tools/list`; `transport-io` adds the stdio transport the server
# speaks over. The feature set is deliberately narrower than `agent-extensions`' (client
# side only): this crate never acts as an MCP client.
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "transport-io"] }
# The async runtime the MCP server runs on; the binary is synchronous and builds one.
tokio = { workspace = true, features = ["rt-multi-thread", "io-std", "io-util"] }

[dev-dependencies]
# The mock model `radian arc work` runs against in `tests/work.rs`.
agent-provider-openai-compatible = { path = "../agent-provider-openai-compatible", features = ["testing"] }
# The tests drive the asynchronous MCP server and the mock model's tokio tasks.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
# `kill(pid, 0)`: whether a hung remote's child is gone after a timeout killed its group.
libc = "0.2"
