[package]
name = "radian-core"
version = "0.2.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Minimal headless agent runtime: turn loop, tools, hooks, steering"

[dependencies]
futures-util.workspace = true
jsonschema.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true

[dev-dependencies]
# Integration tests use the journal test doubles.
radian-core = { path = ".", features = ["testing"] }
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }

[features]
# Test doubles for journalling, for this crate's own tests and for downstream crates.
testing = []
# Self-verify at session end that the journal replay matches the transcript (AC-A1-2).
journal-selfcheck = ["testing"]
