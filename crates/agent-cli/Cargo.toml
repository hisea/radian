[package]
name = "agent-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "A command-line chat client on the agent runtime"
publish = false

[[bin]]
name = "agent"
path = "src/main.rs"

[dependencies]
futures-util.workspace = true
agent-core = { path = "../agent-core" }
agent-extensions = { path = "../agent-extensions" }
agent-provider-openai-compatible = { path = "../agent-provider-openai-compatible" }
radian-coding = { path = "../radian-coding" }
radian-host = { path = "../radian-host" }
radian-permissions = { path = "../radian-permissions" }
radian-runtime = { path = "../radian-runtime" }
radian-sandbox = { path = "../radian-sandbox" }
radian-session = { path = "../radian-session" }
clap = { version = "4", features = ["derive"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "io-util",
    "io-std",
    "sync",
    "time",
] }

[dev-dependencies]
agent-provider-openai-compatible = { path = "../agent-provider-openai-compatible", features = ["testing"] }
libc = "0.2"
serde_json.workspace = true
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "process",
    "io-util",
    "net",
    "time",
] }
