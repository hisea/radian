[package]
name = "agent-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The headless command behind `radian exec` (ADR 0032)"
publish = false

# No binary: `radian exec` is the only entry point now (ADR 0032 direction: the `agent`
# binary is deleted). This crate is the library the `radian` binary links.
[dependencies]
futures-util.workspace = true
agent-core = { path = "../agent-core" }
agent-extensions = { path = "../agent-extensions" }
agent-provider-openai-compatible = { path = "../agent-provider-openai-compatible" }
radian-coding = { path = "../radian-coding" }
radian-host = { path = "../radian-host" }
radian-memory = { path = "../radian-memory" }
radian-permissions = { path = "../radian-permissions" }
radian-runtime = { path = "../radian-runtime" }
radian-sandbox = { path = "../radian-sandbox" }
radian-session = { path = "../radian-session" }
clap = { version = "4", features = ["derive"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "io-util",
    "io-std",
    "sync",
    "time",
] }

[target.'cfg(unix)'.dependencies]
# `radian login` turns the terminal's echo off for the key prompt and restores it on every
# path, Ctrl-C included (signals are blocked across the echo-off window and delivered after
# the restore). The pty tests already used it as a dev-dependency.
libc = "0.2"

[dev-dependencies]
agent-provider-openai-compatible = { path = "../agent-provider-openai-compatible", features = ["testing"] }
agent-provider-anthropic = { path = "../agent-provider-anthropic", features = ["testing"] }
libc = "0.2"
serde_json.workspace = true
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "process",
    "io-util",
    "net",
    "time",
] }
