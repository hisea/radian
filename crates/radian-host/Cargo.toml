[package]
name = "radian-host"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Host plumbing shared by agent-cli and radian-tui: headers, session ids, MCP config and the combined tool provider"
publish = false

[dependencies]
agent-core = { path = "../agent-core" }
# The shared `agent memory` / `/memory` command definitions (ADR 0021 D7): one clap grammar so
# the two hosts cannot drift.
clap = { version = "4", features = ["derive"] }
agent-extensions = { path = "../agent-extensions" }
agent-provider-anthropic = { path = "../agent-provider-anthropic" }
agent-provider-openai-compatible = { path = "../agent-provider-openai-compatible" }
radian-coding = { path = "../radian-coding" }
# `QueuedApprover` implements `radian_permissions::Approver` (ADR 0023 U7); the trait lives
# with the approval layer.
radian-permissions = { path = "../radian-permissions" }
# The session facade (`open_session`) owns the inbox and the driver (ADR 0023 U5).
radian-runtime = { path = "../radian-runtime" }
# The memory service (ADR 0021 D2/D8) sits on the storage layer.
radian-memory = { path = "../radian-memory" }
radian-sandbox = { path = "../radian-sandbox" }
# Reused for the owner-only file/directory creation (ADR 0013) in `diagnostics`.
radian-session = { path = "../radian-session" }
# The model catalog fetches over HTTP (ADR 0018); the same client the adapters use, so no new
# dependency is introduced.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "system-proxy"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# The pending-request queue (ADR 0023 U7) needs `oneshot`/`watch`, and `Approver::decide`
# returns a `BoxFuture`.
futures-util.workspace = true
tokio = { workspace = true }
# The read-only configuration file (ADR 0008) is TOML (its fixtures are TOML). Parsing only:
# this slice never writes the file, so `toml_edit` is not needed.
toml = "0.8"

[dev-dependencies]
# The catalog tests use the adapter's local mock HTTP server, never the real network.
agent-provider-openai-compatible = { path = "../agent-provider-openai-compatible", features = ["testing"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
