[package]
name = "radian-host"
version = "0.1.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Host plumbing shared by radian-exec and radian-tui: headers, session ids, MCP config and the combined tool provider"
publish = false

[features]
# Fault-injection seams for this crate's own integration tests (always on for them via the
# dev-dependency below). Off by default, so a production build or a dependent crate cannot arm
# them.
testing = []

[dependencies]
radian-core = { version = "0.1.1", path = "../radian-core" }
# The shared `radian memory` / `/memory` command definitions (ADR 0021 D7): one clap grammar so
# the two hosts cannot drift.
clap = { version = "4", features = ["derive"] }
agent-extensions = { version = "0.1.1", path = "../agent-extensions" }
agent-provider-anthropic = { version = "0.1.1", path = "../agent-provider-anthropic" }
agent-provider-openai-compatible = { version = "0.1.1", path = "../agent-provider-openai-compatible" }
# The `chatgpt` descriptor's wire protocol (ADR 0026 slice 3); already in the
# workspace since slice 2.
agent-provider-openai-responses = { version = "0.1.1", path = "../agent-provider-openai-responses" }
radian-coding = { version = "0.1.1", path = "../radian-coding" }
# `QueuedApprover` implements `radian_permissions::Approver` (ADR 0023 U7); the trait lives
# with the approval layer.
radian-permissions = { version = "0.1.1", path = "../radian-permissions" }
# The session facade (`open_session`) owns the inbox and the driver (ADR 0023 U5).
radian-runtime = { version = "0.1.1", path = "../radian-runtime" }
# The memory service (ADR 0021 D2/D8) sits on the storage layer.
radian-memory = { version = "0.1.1", path = "../radian-memory" }
radian-sandbox = { version = "0.1.1", path = "../radian-sandbox" }
# Real display width for short model-brand labels (CJK and fullwidth characters are 2 cells);
# `config` measures a brand before padding it.
unicode-width = "0.2.2"
# Reused for the owner-only file/directory creation (ADR 0013) in `diagnostics`.
radian-session = { version = "0.1.1", path = "../radian-session" }
# The journal timestamps are RFC3339 strings; the stall check (ADR 0006 §2) parses them. The
# same `chrono` the session writer already uses to format them, so no new crate enters the tree.
chrono = "0.4"
# The model catalog fetches over HTTP (ADR 0018); the same client the adapters use, so no new
# dependency is introduced. `json`/`form`: the ChatGPT OAuth token and device-code endpoints
# (ADR 0026 slice ①) are JSON and form-encoded respectively.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "system-proxy", "json", "form"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# The task worktree root is walked one directory at a time with `openat(O_NOFOLLOW|O_DIRECTORY)`
# so a symlink at any level is refused (ADR 0039 decision 4); `libc` is the same dependency the
# sandbox and the file tools already use for `O_NOFOLLOW`.
libc = "0.2"
# The pending-request queue (ADR 0023 U7) needs `oneshot`/`watch`, and `Approver::decide`
# returns a `BoxFuture`.
futures-util.workspace = true
# `net`/`io-util`: the ChatGPT OAuth login's one-shot loopback callback listener (ADR 0026
# slice ①) is production code, not a test fixture, so these two features are on
# unconditionally (the mock-server crates only need them under `testing`).
# `process`: ADR 0043 decision 2's `subagent` tool starts a child `radian exec`.
# `time`: the footer command runner bounds each run (`tokio::time::timeout`) and spaces out
# its `ETXTBSY` spawn retries (`tokio::time::sleep`).
tokio = { workspace = true, features = ["net", "io-util", "process", "time"] }
# The configuration file (ADR 0008) is TOML. `toml` reads it; `toml_edit` is the one place
# that writes it back, format-preserving (`/theme`, ADR 0008).
toml = "0.8"
toml_edit = "0.22"
# SHA-256 for the OAuth PKCE challenge (ADR 0026 slice ①); the same crate and
# version `agent-extensions` already depends on, so no new major version enters the tree.
sha2 = "0.10"
# A cryptographically secure RNG for the PKCE verifier and the CSRF `state` (hand-rolling a
# random source for these is exactly the kind of "inventing crypto" AGENTS.md warns against);
# already resolved transitively (rustls' `ring`), this makes it a direct, auditable dependency
# at the version already in the lockfile.
getrandom = "0.3"
# The `[hooks]` matcher is Claude's case-sensitive pattern (`*`/empty matches all,
# otherwise `^(?:<matcher>)$`); `regex` is already in the workspace via `radian-coding`
# (and in `Cargo.lock`), so this adds no new dependency to the tree.
regex = "1"

[dev-dependencies]
# The crate's own tests always build with the worktree-root test seam, so a plain `cargo test`
# (the AGENTS.md Verify list) runs it too; production builds stay unarmed.
radian-host = { path = ".", features = ["testing"] }
# The parse-counting seam: the resume-perf B test asserts a resumed journal is parsed once.
radian-session = { path = "../radian-session", features = ["testing"] }
# The catalog tests use the adapter's local mock HTTP server, never the real network.
agent-provider-openai-compatible = { path = "../agent-provider-openai-compatible", features = ["testing"] }
# The chatgpt provider tests use this adapter's own local mock HTTP server (never the real
# network).
agent-provider-openai-responses = { path = "../agent-provider-openai-responses", features = ["testing"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "test-util"] }
