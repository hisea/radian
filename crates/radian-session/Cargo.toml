[package]
name = "radian-session"
version = "0.1.3"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Session JSONL v1 storage: the durable transcript journal seam for radian-core (ADR 0006)"

[dependencies]
radian-core = { version = "0.1.3", path = "../radian-core" }
chrono = "0.4"
fs2 = "0.4"
futures-util.workspace = true
# The session index cache (ADR 0006 §10). `bundled` compiles SQLite from source, so the
# crate needs no system libsqlite3; the index is always rebuildable from the JSONL.
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true }

[features]
# Fault-injection seams for integration tests
# (always on for this crate's own tests via the dev-dependency below). Off by default so a production
# build cannot arm them.
testing = []

[dev-dependencies]
# The crate's own tests always build with the fault seams, so a plain `cargo test` (the
# AGENTS.md Verify list) runs the fault-injection cases too; production builds stay unarmed.
radian-session = { path = ".", features = ["testing"] }
# `rt-multi-thread` lets the seq-ordering regression test run appends on real parallel
# threads; with the current-thread runtime the race it guards against cannot happen.
tokio = { workspace = true, features = ["rt-multi-thread"] }

[target.'cfg(unix)'.dev-dependencies]
# `dup`/`fcntl` so the inherited-lock test can hand a forked child the exact writer-lock
# descriptor with `FD_CLOEXEC` cleared, and prove the retry rides out the `[fork, exec)` window.
libc = "0.2"