[package]
name = "radian-session"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Session JSONL v1 storage: the durable transcript journal seam for agent-core (ADR 0006)"

[dependencies]
agent-core = { path = "../agent-core" }
chrono = "0.4"
fs2 = "0.4"
futures-util.workspace = true
# The session index cache (ADR 0006 §10). `bundled` compiles SQLite from source, so the
# crate needs no system libsqlite3; the index is always rebuildable from the JSONL.
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true }

[features]
# Fault-injection seams for integration tests
# (`cargo test -p radian-session --features testing`). Off by default so a production
# build cannot arm them.
testing = []

[dev-dependencies]
# `rt-multi-thread` lets the seq-ordering regression test run appends on real parallel
# threads; with the current-thread runtime the race it guards against cannot happen.
tokio = { workspace = true, features = ["rt-multi-thread"] }