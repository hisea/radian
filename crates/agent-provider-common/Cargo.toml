[package]
name = "agent-provider-common"
version = "0.2.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Code the radian provider adapters share: SSE reader, Retry-After, usage-limit recognizers, mock HTTP server"
publish = false

[features]
# The in-process mock HTTP server the adapters' own `testing` modules wrap.
testing = ["tokio/net", "tokio/io-util", "tokio/rt"]

[dependencies]
radian-core = { version = "0.2.0", path = "../radian-core" }
reqwest = { version = "0.13", default-features = false }
serde_json.workspace = true
tokio = { workspace = true, features = ["time"] }
