[package]
name = "agent-extensions"
version = "0.1.2"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "MCP stdio tool servers for radian-core"
publish = false

[dependencies]
radian-core = { version = "0.1.2", path = "../radian-core" }
# Pinned: lifecycle and wire behavior were verified against this exact version.
rmcp = { version = "=3.5.1", default-features = false, features = ["client", "transport-async-rw"] }
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
tokio = { workspace = true, features = ["process", "io-util"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }

# A hand-written MCP server used only by the integration tests. It speaks either the
# 2025-11-25 (initialize) or 2026-07-28 (server/discover) lifecycle, independent of rmcp.
[[bin]]
name = "mcp-fixture"
path = "tests/fixture/mcp_fixture.rs"
test = false
bench = false
doc = false
