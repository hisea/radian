[package]
name = "radian-memory"
version = "0.2.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "ADR 0021 memory storage: Markdown record files, per-scope indexes, project registry"

[dependencies]
# Timestamps use the same `chrono` format as `radian-session` (already in the workspace lock).
chrono = "0.4"
# The single-writer lock and the fsync discipline mirror `radian-session`.
fs2 = "0.4"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
