[package]
name = "radian-sandbox"
version = "0.1.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "OS sandbox backends (macOS sandbox-exec, Linux bubblewrap) that refuse to run without enforcement"

[dependencies]
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
# The escape matrix holds a pty outside the sandbox and does `ioctl(TIOCSTI)` to test the
# ADR 0016 defense; `posix_openpt`/`grantpt`/`unlockpt`/`ptsname`/`tcsetattr` and the ioctl
# constants are libc-only. macOS and Linux are the only supported platforms.
libc = "0.2"

[dev-dependencies]
# The escape-matrix harness and the cross-platform driver build under `testing`.
radian-sandbox = { path = ".", features = ["testing"] }

[features]
# The escape-matrix harness used by the tests and by the `sandbox-escape` driver that runs
# on the Linux VM. Not part of the product surface.
testing = []

[[bin]]
name = "sandbox-escape"
path = "src/bin/sandbox-escape.rs"
required-features = ["testing"]

# ADR 0016 acceptance 1: prints `confined_by_outer_sandbox()` for its own process, so
# `tests/escape_macos.rs` can run it under `sandbox-exec` and read the kernel's answer.
[[bin]]
name = "sandbox-confined"
path = "src/bin/sandbox-confined.rs"
required-features = ["testing"]