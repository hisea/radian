[package]
name = "radian-permissions"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Permission layer: ApprovalPolicy + ToolRuleSet as a Hooks implementation (ADR 0012)"

[dependencies]
agent-core = { path = "../agent-core" }
radian-sandbox = { path = "../radian-sandbox" }
radian-session = { path = "../radian-session" }
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time", "test-util"] }
