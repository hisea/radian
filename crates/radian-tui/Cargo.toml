[package]
name = "radian-tui"
version = "0.3.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Full-screen TUI shell on radian-runtime (Phase 4 / A)"

# `cargo binstall` fetches the release tarballs (`radian-<version>-<target>.tar.gz`,
# holding `radian` and `rad` at the top level) instead of building from source.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/radian-{ version }-{ target }.tar.gz"

# `radian` is the full-screen TUI and `rad` its alias. Both are thin wrappers around
# `radian_tui::cli::run_cli`; `rad` has its own one-line `src/rad.rs` (not a second `[[bin]]`
# on `src/main.rs`) so no source file belongs to two targets, and the command's unit tests are
# built once (in the library) instead of twice.
[[bin]]
name = "radian"
path = "src/main.rs"

[[bin]]
name = "rad"
path = "src/rad.rs"

[dependencies]
# The `radian exec` subcommand and the top-level management commands (ADR 0032 slice 1): the
# `agent` command as a library, so both entries run the same parser and dispatch.
radian-exec = { version = "0.2.0", path = "../radian-exec" }
# `radian arc`: the plan and task orchestrator's control plane (ADR 0048): the store, the
# gate, and `radian arc work`, the internal worker wrapper.
radian-arc = { version = "0.2.0", path = "../radian-arc" }
radian-core = { version = "0.2.0", path = "../radian-core" }
agent-extensions = { version = "0.2.0", path = "../agent-extensions" }
agent-provider-openai-compatible = { version = "0.2.0", path = "../agent-provider-openai-compatible" }
futures-util.workspace = true
radian-coding = { version = "0.2.0", path = "../radian-coding" }
radian-host = { version = "0.2.0", path = "../radian-host" }
radian-permissions = { version = "0.2.0", path = "../radian-permissions" }
radian-runtime = { version = "0.2.0", path = "../radian-runtime" }
radian-sandbox = { version = "0.2.0", path = "../radian-sandbox" }
radian-session = { version = "0.2.0", path = "../radian-session" }
clap = { version = "4", features = ["derive"] }
# The vendored Mermaid renderer (ADR 0042): the transcript draws a closed ```mermaid block
# as Unicode box drawing. `radian-tui` depends on the crate directly (ADR 0042 supplement:
# there is no `radian-host` entry point any more, and radian-host stays ratatui-free).
grok-mermaid = { version = "0.0.0", path = "../../third_party/grok-mermaid" }
# Assistant-text Markdown (ADR 0028 R2): CommonMark + tables, no syntax highlighting (slice 5).
# `default-features = false` drops the HTML renderer and the SIMD scanner: this crate only
# walks the event stream, and the build stays dependency-light on the 1.99.1 MSRV.
pulldown-cmark = { version = "0.12", default-features = false }
# The slash-command arguments: quoted values like `/memory add "two words"`.
shlex = "2"
# Syntax highlighting (ADR 0028 R2 decision 2): syntect with the **pure-Rust** regex
# backend (`regex-fancy`, no oniguruma) and the packed default syntax set (`default-syntaxes`).
# No syntect themes: colors come from the Radian theme (ADR 0029).
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy", "dump-load"] }
ratatui = "0.30.2"
# Images in the transcript (ADR 0028; docs/backlog/images.md Q8): `ratatui-image` probes the
# terminal and picks the graphics protocol (kitty, iTerm2, sixel, half blocks). The
# `chafa-dyn` default is **never** on: it links libchafa dynamically and the binary then fails
# to start where the library is missing. `image-defaults` pulls the `image` decoder this crate
# already needs, and `crossterm` is the backend the TUI already uses.
ratatui-image = { version = "11.1.0", default-features = false, features = ["image-defaults", "crossterm"] }
# The decoder behind the transcript image (ADR 0028 R10): the parts carry base64, and the
# four accepted formats are the magic-number set `radian-coding` accepts. `ratatui-image`'s
# `image-defaults` turns every format on anyway; naming them here keeps the intent visible.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# The image parts' base64 payload: decode once per image for the transcript (ADR 0028 R10).
base64 = "0.22"
# Reading an image from the system clipboard for the `paste_image` action (ADR 0028 R5;
# docs/backlog/images.md Q2/Q7): macOS NSPasteboard, Linux X11 and Wayland, Windows.
# `wayland-data-control` is on so a Wayland session reads the clipboard without an XWayland
# fallback; the crate is pure Rust there and needs no new system library at build time.
arboard = { version = "3.7", default-features = false, features = ["image-data", "wayland-data-control"] }
serde_json.workspace = true
# The TOML theme files (ADR 0029): the same parser the config uses
# (`radian-host`), so a `[roles]` table and `[tui.colors]` share one value shape
# (`TuiColorOverride::from_toml`). The crate is already in the tree via `radian-host`.
toml = "0.8"
unicode-width = "0.2.2"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "process", "signal"] }

[build-dependencies]
# The build script (`build.rs`) checks the committed `assets/syntaxes.packdump` against the
# vendored grammars and copies it to `$OUT_DIR/syntaxes.packdump`; the runtime dep above only
# deserializes it. syntect is needed here only by the regeneration path
# (`RADIAN_REGENERATE_SYNTAXES=1 cargo build -p radian-tui`), which parses the YAML and dumps the
# merged set — see the header of `build.rs`.
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy", "default-syntaxes", "yaml-load", "dump-create"] }

[target.'cfg(unix)'.dependencies]
# `poll(2)` detects a terminal that has gone away (the pty master closed) before crossterm's
# event reader busy-loops on the resulting EOF; see `read_input` in `cli.rs`. Already in the
# dependency tree (a dev-dependency of this crate and a transitive dependency elsewhere).
libc = "0.2"

[target.'cfg(unix)'.dev-dependencies]
# The panic-path test checks that a child process group is really gone.
libc = "0.2"

[dev-dependencies]
# The shared heading-anchored table reader for the manual drift tests.
radian-coding = { path = "../radian-coding", features = ["testing"] }
# The board test writes a heartbeat a known age before now, so its card prints that age.
chrono = "0.4"
radian-core = { path = "../radian-core" }
radian-memory = { path = "../radian-memory" }
# The `radian arc mcp` tests drive the real server through a real MCP client over the
# server's own stdio, as `agent-extensions` drives a server. Pinned to the version the
# server side uses.
rmcp = { version = "=3.5.1", default-features = false, features = ["client", "transport-async-rw"] }
# The `radian arc` lock test holds `state.lock` from the test process, the same flock the
# store takes.
fs2 = "0.4"
agent-provider-openai-compatible = { path = "../agent-provider-openai-compatible", features = ["testing"] }
agent-provider-anthropic = { path = "../agent-provider-anthropic", features = ["testing"] }
radian-session = { path = "../radian-session" }
portable-pty = "0.9.0"
ratatui = "0.30.2"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "test-util"] }
vt100 = "0.16.2"
