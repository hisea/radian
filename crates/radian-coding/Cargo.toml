[package]
name = "radian-coding"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Built-in coding tools (read/write/patch/list + read-only git) with workspace path confinement"

[dependencies]
radian-core = { path = "../radian-core" }
# `Prompter::ask` returns a boxed future (ADR 0024 Q1), the same shape as `Approver::decide`.
futures-util.workspace = true
# `glob`/`grep`: match a workspace-relative path against the model's glob pattern.
globset = "0.4"
# `glob`/`grep`: gitignore-aware directory walking (skips `.git`, respects `.gitignore`).
ignore = "0.4"
# `grep`: compile the search pattern, so an invalid regex is a named tool error.
regex = "1"
# `shell` runs only through this crate's backends; it is never invoked without one.
radian-sandbox = { path = "../radian-sandbox" }
serde.workspace = true
serde_json.workspace = true
unicode-width = "0.2.2"
thiserror.workspace = true
tokio = { workspace = true, features = ["process"] }

[target.'cfg(unix)'.dependencies]
# `O_NOFOLLOW` for the write path: refuse to follow a symlink at the destination.
libc = "0.2"

[target.'cfg(unix)'.dev-dependencies]
# The shell tests check that a killed process group has no members left.
libc = "0.2"

[dev-dependencies]
# The `ask_user` journal test needs the journal test double (feature `testing`).
radian-core = { path = "../radian-core", features = ["testing"] }
# The fd-walk swap test needs the resolve hook (feature `testing`, ADR 0039 decision 2).
radian-coding = { path = ".", features = ["testing"] }

[features]
# A test seam between the lexical path check and the first `openat` (`safe_fs::resolve_hook`).
testing = []