[package]
name = "radian-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Runtime layer: the durable inbox and the per-session driver (ADR 0011)"

[dependencies]
agent-core = { path = "../agent-core" }
radian-session = { path = "../radian-session" }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true }

[features]
# Forward the core's journal self-check, so this crate's failure-path tests (ADR 0017) also
# run with replay verified against the transcript.
journal-selfcheck = ["agent-core/journal-selfcheck"]

[dev-dependencies]
agent-provider-anthropic = { path = "../agent-provider-anthropic", features = ["testing"] }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time", "test-util"] }
