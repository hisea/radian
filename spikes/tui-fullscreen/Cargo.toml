[workspace]

[package]
name = "tui-fullscreen-spike"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "tui_fullscreen_spike"
path = "src/lib.rs"

[[bin]]
name = "tui-app"
path = "src/app.rs"

[[bin]]
name = "tui-driver"
path = "src/driver.rs"

[dependencies]
ratatui = "0.30.2"
portable-pty = "0.9.0"
vt100 = "0.16.2"
unicode-width = "0.2.2"
serde_json = "1.0.154"
