# Nextest config: how the Verify suite runs in parallel.
#
# `cargo test` runs every test binary one after another; nextest runs each test
# as its own process and schedules them across threads. The pty suite drives a
# whole app per test, so it gets its own group capped at 6 concurrent tests: 6
# kept a 10-core M4 and the 16-core Linux gate busy without flaking, and a fixed
# number is all nextest's `max-threads` allows (it cannot scale with the machine).
# Everything else runs at nextest's default (one thread per CPU).
#
# `slow-timeout`: a hung test is sent SIGTERM after `period`, SIGKILL after
# `terminate-after` more periods, and counts as failed instead of wedging the run.
# The slowest measured pty test takes ~12 s (queue-during-turn, 6-wide on a 10-core
# M4); the exec suites wait on a 120 s in-test `EXIT_WATCHDOG` before calling a stuck
# CLI stuck (crates/radian-exec/tests/{cli,exec,exec_jobs,jsonl,subagent}.rs), and
# the pty suite waits up to 60 s per wait (`WAIT_POSITIVE`). The period must stay above
# the largest in-test watchdog so a hung CLI fails inside the test first, keeping the
# child's stderr in the panic message instead of nextest's bare timeout: 180 s gives
# 60 s of headroom over the 120 s watchdogs while a real hang is still cut within
# minutes (SIGTERM at 3 min, SIGKILL at 6 min).

[profile.default]
fail-fast = false
slow-timeout = { period = "180s", terminate-after = 1 }

[test-groups.pty]
max-threads = 6

[[profile.default.overrides]]
filter = "package(radian-tui) and binary(pty)"
test-group = "pty"


# `sandbox`: what an arc worker runs inside the `workspace` tier (ADR 0048 §7).
# It is the default profile minus the tests that cannot pass inside that tier;
# `crates/radian-sandbox/LIMITS.md` ("在沙箱内跑测试") explains each cause. The
# default profile and the gate are unchanged, so nothing is excluded outside the
# sandbox.
#
# Every exclusion is one exact test name, `test(=name)`, never a substring or a
# module wildcard: `crates/radian-host/tests/nextest_profile.rs` fails when a name
# here no longer names a test. One comment block per cause group, in the order the
# filter lists the groups (blank lines in the expression separate them):
#
# 1. Scratch trees under `/tmp` (231 names). The sandbox only writes inside the
#    workspace, so `create_dir_all("/tmp/…")` is denied with EPERM. The exec and
#    control suites use `/tmp` on purpose: `$TMPDIR` sits inside the workspace and
#    its long path breaks the Unix sockets they open (groups 4 and 5).
#
# 2. `ps` is denied, so a process start time cannot be read (3 names). The
#    `ps -o lstart=` command exits 126 inside the sandbox, and arc treats a
#    missing start time as a dead process.
#
# 3. A nested Seatbelt cannot apply a second profile (13 names). The probe fails,
#    the backend is `inherited`, and only the outer rules apply: profile-wiring
#    probes see `ReadOnly`, sandboxed hooks cannot start, the arc worker deny-read
#    check is not enforced, the nested-session refusal is skipped, and
#    `radian-sandbox`'s own backend tests cannot build their layer
#    (`LIMITS.md` "嵌套").
#
# 4. `TMPDIR` points inside the repository (12 names). `std::env::temp_dir()` scratch
#    trees then sit in the repository: git, the canonical workspace, context files,
#    skill discovery and project identity see the outer repository, and its
#    AGENTS.md reaches a test workspace.
#
# 5. The same long `TMPDIR` pushes a Unix socket path past SUN_LEN (6 names). The
#    bind fails with "path must be shorter than SUN_LEN" before any sandbox rule is
#    involved.

[profile.sandbox]
# See the group list above; the blank lines below separate the groups.
