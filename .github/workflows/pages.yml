# Deploy getrad.dev (the static home page plus the generated manual) to GitHub Pages.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/user/**"
      - "crates/radian-tui/examples/site-docs.rs"
      - "crates/radian-tui/src/site_docs.rs"
      - "crates/radian-tui/tests/site_docs.rs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# The deploy reads the tree, publishes the Pages artifact and authenticates to
# the Pages API, and nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time: a queued run waits for the running one, never cancels it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@v2
      - name: build the site with the generated docs
        run: |
          rm -rf _site
          mkdir -p _site
          cp site/index.html site/arc.html site/favicon.svg site/docs.css _site/
          cp -r site/media _site/media
          cargo run -p radian-tui --example site-docs --locked -- _site
          printf 'getrad.dev' > _site/CNAME
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
