# CI for main. While the repository is private, the hosted minutes are limited, and every
# push to main has already passed the full Verify in the gate. So the Linux check runs once a
# day (skipped when main did not change) and on demand; macOS runs only on demand.
# When the repository is public, add `push: { branches: [main] }` and `pull_request:` below.
name: ci

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      macos:
        description: "Also run the macOS sandbox and pty tests"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  changed:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v5
      - id: check
        run: |
          if [ "${{ github.event_name }}" != schedule ]; then echo run=true >> "$GITHUB_OUTPUT"; exit 0; fi
          age=$(( $(date +%s) - $(git log -1 --format=%ct) ))
          if [ "$age" -lt 90000 ]; then echo run=true >> "$GITHUB_OUTPUT"; else echo run=false >> "$GITHUB_OUTPUT"; fi

  linux:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: bubblewrap for the workspace sandbox
        run: |
          sudo apt-get update -q && sudo apt-get install -yq bubblewrap
          # Ubuntu 24.04 blocks unprivileged user namespaces by default; bubblewrap needs them.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: build the binaries the pty tests run
        run: |
          cargo build -p radian-tui --bin radian --locked
          cargo build -p agent-extensions --bin mcp-fixture --locked
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p radian-core --all-targets --features journal-selfcheck -- -D warnings
      - run: cargo test --workspace --locked --no-fail-fast
      - run: cargo test -p radian-core --locked --features journal-selfcheck
      - run: bash docs/schema/check-fixtures.sh
      - run: bash docs/schema/check-config-fixtures.sh
      - name: provider contract suites
        run: |
          cargo test -p agent-provider-openai-compatible --features testing --test contract
          cargo test -p agent-provider-anthropic --features testing --test contract
          cargo test -p agent-provider-openai-responses --features testing --test contract

  macos:
    needs: changed
    if: github.event_name == 'workflow_dispatch' && inputs.macos
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: build the binaries the pty tests run
        run: |
          cargo build -p agent-extensions --bin mcp-fixture --locked
          cargo build -p radian-tui --bin radian --locked
      - run: cargo clippy -p radian-sandbox -p radian-tui --all-targets -- -D warnings
      - run: cargo test -p radian-sandbox --locked --no-fail-fast
      - run: cargo test -p radian-tui --test pty --locked --no-fail-fast

  secrets:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks over the whole history
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git . --no-banner --redact
