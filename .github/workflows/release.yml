name: release

on:
  push:
    tags:
      - "v*"

# Pushing the tag is the only manual step: this workflow checks the tag,
# builds the two Linux musl tarballs, builds/signs/notarizes the two macOS
# tarballs through scripts/release-macos.sh, creates and publishes the release
# with the version's notes file, and pushes Formula/radian.rb to the Homebrew
# tap (normal releases only). The maintainer fallback is documented in
# scripts/README.md; the local entry points live in scripts/release-macos.sh.
# No top-level write access: every job declares the least permissions it needs.
permissions: {}

jobs:
  check:
    name: check the tag, the notes file and the crate version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      notes: ${{ steps.check.outputs.notes }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5

      - id: check
        run: |
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in
            v?*) ;;
            *) echo "release: tag '$TAG' does not start with 'v'." >&2; exit 1 ;;
          esac
          VERSION="${TAG#v}"
          NOTES="packaging/release-notes/${VERSION}.md"
          [ -s "$NOTES" ] || {
            echo "release: missing notes file $NOTES for tag $TAG." >&2; exit 1; }
          CRATE_VERSION="$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/radian-tui/Cargo.toml | head -n 1)"
          [ -n "$CRATE_VERSION" ] || {
            echo "release: could not read the version of crates/radian-tui." >&2
            exit 1; }
          BASE="${VERSION%%-*}"
          [ "$BASE" = "$CRATE_VERSION" ] || {
            echo "release: tag base version $BASE differs from crate version $CRATE_VERSION." >&2
            exit 1; }
          case "$VERSION" in
            *-*) PRERELEASE=true ;;
            *) PRERELEASE=false ;;
          esac
          {
            echo "version=$VERSION"
            echo "notes=$NOTES"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"
          echo "release: $TAG ok (notes $NOTES, crate $CRATE_VERSION, prerelease $PRERELEASE)."

  linux:
    name: linux ${{ matrix.target }}
    needs: [check]
    permissions:
      contents: read
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Rust 1.99.1 plus the musl target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}

      # Static musl binaries run on any Linux distro regardless of its glibc,
      # which is what a release tar needs. zig cc is a full cross toolchain in
      # one install (no docker, no per-arch sysroot): cargo-zigbuild drives it
      # as the linker for both musl targets. Everything linked is pure Rust
      # except rusqlite's bundled C, which zig cc compiles as well; reqwest
      # uses rustls, so there is no system OpenSSL to find.
      - name: zig plus cargo-zigbuild
        run: |
          python3 -m pip install --quiet ziglang
          cargo install --locked --quiet cargo-zigbuild

      - name: Build radian and rad
        run: |
          cargo zigbuild --locked --release \
            -p radian-tui --bin radian --bin rad \
            --target ${{ matrix.target }}
          test -x target/${{ matrix.target }}/release/radian
          test -x target/${{ matrix.target }}/release/rad

      - name: Smoke-test the x86_64 binary
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: target/${{ matrix.target }}/release/radian --version

      - name: Package the tarball plus sha256
        run: |
          version="${{ needs.check.outputs.version }}"
          stage="stage-${{ matrix.target }}"
          mkdir -p "$stage" dist
          cp target/${{ matrix.target }}/release/radian \
             target/${{ matrix.target }}/release/rad "$stage/"
          tarball="dist/radian-${version}-${{ matrix.target }}.tar.gz"
          tar -czf "$tarball" -C "$stage" radian rad
          rm -rf "$stage"
          (cd dist && shasum -a 256 "$(basename "$tarball")" > "$(basename "$tarball").sha256")
          (cd dist && shasum -a 256 -c "$(basename "$tarball").sha256")
          tar -tzf "$tarball"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  macos:
    name: sign, notarize and package macOS
    needs: [check]
    # One arm64 runner builds both macOS targets: the Rust toolchain,
    # codesign and lipo all work across the two macOS arches, so a single
    # temporary keychain covers both targets and the two notarization waits
    # stay in one job instead of duplicating the credential setup per target.
    runs-on: macos-14
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Require the signing secrets before any build time
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          missing=""
          [ -n "$MACOS_CERT_P12_BASE64" ] || missing="$missing MACOS_CERT_P12_BASE64"
          [ -n "$MACOS_CERT_PASSWORD" ] || missing="$missing MACOS_CERT_PASSWORD"
          [ -n "$APPLE_API_KEY_P8_BASE64" ] || missing="$missing APPLE_API_KEY_P8_BASE64"
          [ -n "$APPLE_API_KEY_ID" ] || missing="$missing APPLE_API_KEY_ID"
          [ -n "$APPLE_API_ISSUER_ID" ] || missing="$missing APPLE_API_ISSUER_ID"
          [ -z "$missing" ] || {
            echo "release: missing secret(s):$missing." >&2; exit 1; }

      - name: Rust 1.99.1 plus both macOS targets
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Temporary keychain with the Developer ID certificate
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/radian-release.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          openssl base64 -d -out "$RUNNER_TEMP/radian-cert.p12" <<EOF
          $MACOS_CERT_P12_BASE64
          EOF
          security import "$RUNNER_TEMP/radian-cert.p12" -P "$MACOS_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          rm -f "$RUNNER_TEMP/radian-cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # Prepend the temporary keychain to the search list (xargs splits the
          # list into arguments, so no unquoted expansion is needed).
          {
            echo "$KEYCHAIN_PATH"
            security list-keychains -d user | tr -d '"'
          } | tr '\n' ' ' | xargs security list-keychain -d user -s
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | sed -n 's/^ *[0-9]*) [0-9A-F]* "\(Developer ID Application: .*\)"$/\1/p' \
            | head -n 1)"
          [ -n "$IDENTITY" ] || {
            echo "release: no Developer ID Application identity in the temporary keychain." >&2
            exit 1; }
          echo "RADIAN_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Write the App Store Connect API key file
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          openssl base64 -d -out "$RUNNER_TEMP/radian-notary-key.p8" <<EOF
          $APPLE_API_KEY_P8_BASE64
          EOF
          chmod 600 "$RUNNER_TEMP/radian-notary-key.p8"

      - name: Build, sign, notarize and package both macOS targets
        env:
          RADIAN_NOTARY_API_KEY_FILE: ${{ runner.temp }}/radian-notary-key.p8
          RADIAN_NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          RADIAN_NOTARY_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          sh scripts/release-macos.sh "${{ needs.check.outputs.version }}" --package-only

      - name: Delete the temporary keychain and the key file
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/radian-release.keychain-db" || true
          rm -f "$RUNNER_TEMP/radian-notary-key.p8"

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/
          if-no-files-found: error

  publish:
    name: publish the GitHub release
    needs: [check, linux, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create and publish the release with the notes file
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ needs.check.outputs.notes }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          ls dist
          (cd dist && shasum -a 256 -c ./*.sha256)
          if [ "$PRERELEASE" = "true" ]; then
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file "$NOTES" \
              --prerelease \
              dist/*
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file "$NOTES" \
              dist/*
          fi

      - name: Refuse an empty release body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY="$(gh release view "${GITHUB_REF_NAME}" --json body -q .body)"
          [ -n "$BODY" ] || {
            echo "release: published release has empty notes." >&2; exit 1; }

      - name: Check every asset anonymously
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          checkdir="$(mktemp -d)"
          cp dist/*.sha256 "$checkdir/"
          for target in aarch64-apple-darwin x86_64-apple-darwin \
            aarch64-unknown-linux-musl x86_64-unknown-linux-musl; do
            asset="radian-${VERSION}-${target}.tar.gz"
            curl --netrc-file /dev/null -fsSL -o "$checkdir/$asset" \
              "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/$asset"
            (cd "$checkdir" && shasum -a 256 -c "$asset.sha256") || {
              echo "release: anonymous download of $asset mismatches." >&2
              exit 1; }
          done
          rm -rf "$checkdir"

  homebrew-tap:
    name: push Formula/radian.rb to the tap
    needs: [check, publish]
    # Pre-releases never touch the tap: only plain vX.Y.Z updates the formula.
    if: needs.check.outputs.prerelease != 'true'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Require the tap token before any push
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          [ -n "$HOMEBREW_TAP_TOKEN" ] || {
            echo "release: missing secret HOMEBREW_TAP_TOKEN." >&2; exit 1; }

      - name: Render the formula and push it to the tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          sh scripts/release-macos.sh "$VERSION" --render-formula
          tapdir="$(mktemp -d)"
          gh repo clone hisea/homebrew-tap "$tapdir"
          cp "dist/Formula/radian.rb" "$tapdir/Formula/radian.rb"
          [ "$(cd "$tapdir" && git status --porcelain)" = " M Formula/radian.rb" ] || {
            echo "release: tap tree touched more than Formula/radian.rb." >&2
            (cd "$tapdir" && git status --porcelain) >&2
            exit 1; }
          (cd "$tapdir" && git add Formula/radian.rb \
            && git commit -m "radian $VERSION" && git push origin HEAD)
          rm -rf "$tapdir"
