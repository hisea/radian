[workspace]
resolver = "3"
members = [
    "crates/agent-core",
    "crates/agent-extensions",
    "crates/agent-provider-openai-compatible",
    "crates/agent-provider-anthropic",
    "crates/agent-cli",
    "crates/radian-slots",
    "crates/agent-provider-contract",
    "crates/radian-session",
    "crates/radian-coding",
    "crates/radian-runtime",
]

[workspace.package]
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
jsonschema = { version = "0.58", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-util = "0.7"
