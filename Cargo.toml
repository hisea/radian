[workspace]
resolver = "3"
members = [
    "crates/radian-core",
    "crates/agent-extensions",
    "crates/agent-provider-openai-compatible",
    "crates/agent-provider-openai-responses",
    "crates/agent-provider-anthropic",
    "crates/radian-exec",
    "crates/radian-host",
    "crates/agent-provider-contract",
    "crates/radian-session",
    "crates/radian-coding",
    "crates/radian-runtime",
    "crates/radian-sandbox",
    "crates/radian-tui",
    "crates/radian-permissions",
    "crates/radian-memory",
    "third_party/grok-mermaid",
]

[workspace.package]
edition = "2024"
rust-version = "1.99.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hisea/radian"

[workspace.dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
jsonschema = { version = "0.58", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-util = "0.7"

# Build speed and disk (nobody uses a debugger on these builds). Dependencies
# carry no debug info at all; the workspace crates keep only line tables, so a panic backtrace
# still names file and line. Test failure locations do not depend on debug info. `test` inherits
# `dev`.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
